services:
  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    shm_size: 512mb
    init: true
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SANDBOX_BASE_URL: http://sandbox:3001
    depends_on:
      - sandbox
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    init: true
    restart: unless-stopped